name: Bug or installation problem
description: Report a setup failure, exception, or reproducible software bug.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        For an unexpected scoring decision or unclear accounting task, choose the Task or scorer feedback form instead. Remove API keys, evaluator secrets, and private data from examples and logs.
  - type: input
    id: version
    attributes:
      label: Source commit or installed version
      description: Include the Git commit when running from a checkout.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Operating system and Python version
      placeholder: Ubuntu 24.04, Python 3.12
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and task ID if applicable. Keep the example as small as possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      description: Include the traceback or relevant excerpt, with credentials and private data removed.
      render: text
