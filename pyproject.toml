[project]
name = "beancount-ledger"
description = "Bank reconciliation and month-end close on a Beancount ledger, scored deterministically"
tags = ["accounting", "tool-use", "multi-turn", "train", "eval"]
version = "0.1.0"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "Hasancan Gültekin", email = "gultekinhasancan79@gmail.com"}]
requires-python = ">=3.11,<3.14"          # verifiers 0.3.1 admits 3.11-3.13
# PINNED EXACTLY, on purpose.
#
# `episode_contract_digest()` binds the tool schemas the MODEL is shown, and we
# do not write them: `verifiers` calls `openai-agents`' `function_schema`,
# which parses our docstrings with `griffelib` and emits the JSON schema
# through `pydantic`/`pydantic-core`. A minor bump in any of those can change a
# title, a `required` array, an enum form or a description — the digest moves
# and not a line of ours changed. `openai` is the client that puts that schema
# on the wire, `datasets` carries the prompt rows, `beancount` is the loader
# the scorer's verdict comes from.
#
# `beancount_ledger.PINNED_LIBRARIES` names the same set, every rollout carries
# `state["piv_library_versions"]`, and `tests/test_entrypoints.py` fails when
# the installed versions differ from these pins — so a bump is loud in exactly
# one place and silent in none. Bumping means: change the pin, re-run the
# battery, re-pin BOTH `EPISODE_CONTRACT_DIGEST` and
# `EPISODE_CONTRACT_DIGEST_CASH_APPLICATION` if they moved (one resolved
# view per episode profile), and treat any moved digest as a new
# measurement condition.
dependencies = [
    "verifiers==0.3.1",
    "openai==3.5.0",
    "openai-agents==0.22.0",
    "griffelib==2.2.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "datasets==5.0.1",
    "beancount==3.2.3",
]

[project.optional-dependencies]
# The desktop app (tests/replay_webview.py): a native window hosting the replay
# page. Not needed to serve or score; installed with `uv pip install -e ".[app]"`.
app = ["pywebview>=5,<7"]

[project.urls]
Homepage = "https://github.com/gultekinhasancan79/beancount-ledger"
Repository = "https://github.com/gultekinhasancan79/beancount-ledger"
Issues = "https://github.com/gultekinhasancan79/beancount-ledger/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package became a DIRECTORY when the graph/candidate/canonical split
# landed; the old `include = ["beancount_ledger.py", ...]` (a single file that
# no longer exists at the root) built an EMPTY wheel. Ship the package with its
# runtime data (world/, tasks/) and nothing else: no tests/, no reviews/, no
# caches — the Hub artefact carries no goldens, no provenance records and no
# secrets (serving security rests on the evaluator secret and the signed
# manifest, never on code secrecy).
[tool.hatch.build.targets.wheel]
packages = ["beancount_ledger"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["beancount_ledger/**", "pyproject.toml", "README.md", "LICENSE"]
# `README.md` as an include pattern matches at ANY depth in hatchling, which
# pulled reviews/README.md into the sdist (caught by the artefact audit).
# Exclude the evidence and test trees outright: the Hub artefact carries no
# reviews, no tests, no goldens.
exclude = ["**/__pycache__", "**/*.pyc", "reviews/**", "tests/**", ".venv/**"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
